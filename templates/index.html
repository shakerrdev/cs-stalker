<html lang="eng">

<head>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <link rel="stylesheet" href="/static/index.css" />
</head>

<body>
  <header>
    <a class="logo" href="/">cs-stalker</a>
    <nav>
      <ul>
        <li><a href="https://moon2.tv/">moon</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <div id="content">
      <h1>BANANA</h1>
      <div id="minion">
        <button hx-get="/minion" hx-trigger="click once" hx-target="#minion" hx-swap="outerHTML">ROFL</button>
      </div>
      <form hx-post="/profile" hx-target="#profiles #indicator" hx-swap="afterend" hx-indicator="#indicator">
        <input type="url" name="url" placeholder="https://steamcommunity.com/id/xyz">
      </form>
      <div id="profiles">
        <img id="indicator" class="htmx-indicator" src="/static/imgs/three-dots.svg">
      </div>
    </div>
  </main>
  <footer><label>© 2024 - finn</label></footer>
</body>

</html>
